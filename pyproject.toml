[project]
name = "clinicreport"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.100.0",
    "ffmpeg>=1.4",
    "google>=3.0.0",
    "google-genai>=1.75.0",
    "google-generativeai>=0.8.6",
    "ipykernel>=7.2.0",
    "nemo-toolkit[asr]>=2.7.3",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "openai-whisper>=20250625",
    "pandas>=3.0.2",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "setuptools-rust>=1.12.1",
    "soundfile>=0.13.1",
    "sox>=1.5.0",
    "text-unidecode>=1.3",
    "wget>=3.2",
    "whisper>=1.1.10",
    "whisperx>=3.8.5",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "hf-xet>=1.5.0",
    "streamlit>=1.57.0",
    "fastapi[standard]>=0.136.1",
    "uvicorn>=0.47.0",
    "python-multipart>=0.0.29",
    "pydantic[email]>=2.13.4",
    "sqlalchemy>=2.0.49",
    "psycopg>=3.3.4",
    "pydantic-settings>=2.14.1",
    "alembic>=1.18.4",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.0",
    "types-python-jose>=3.5.0.20260408",
    "python-jose[cryptography]>=3.5.0",
]


[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
